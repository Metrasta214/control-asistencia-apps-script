<!doctype html>
<html lang="es">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Control de asistencia</title>

    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fa;
        --panel: #ffffff;
        --text: #182438;
        --muted: #627087;
        --border: #dce3ed;
        --primary: #2459a9;
        --primary-dark: #194581;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        max-width: 1180px;
        margin: auto;
        padding: 28px 18px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(26px, 4vw, 38px);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(24, 36, 56, 0.05);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 16px;
        padding: 22px;
      }

      .field {
        min-width: 0;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: bold;
      }

      .field input,
      .field select {
        width: 100%;
        min-width: 0;
        height: 46px;
        padding: 0 10px;
        border: 1px solid #bdc9d9;
        border-radius: 8px;
        background: white;
        color: var(--text);
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid #c7d4e7;
        border-radius: 8px;
        background: #edf3fc;
        color: #204d8c;
        font-weight: bold;
        cursor: pointer;
      }

      button.primary {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        margin-left: auto;
      }

      button.primary:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      button:disabled,
      input:disabled,
      select:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #90baff;
        outline-offset: 2px;
      }

      .summary {
        padding: 16px 22px;
        background: #f8faff;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: white;
        font-size: 13px;
        font-weight: bold;
      }

      .status {
        margin-top: 10px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .status.success {
        color: #17633c;
      }

      .status.error {
        color: #b42318;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .name-col {
        width: 40%;
      }

      .state-col {
        width: 15%;
      }

      thead {
        background: #edf2fb;
      }

      th,
      td {
        padding: 14px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      thead th {
        font-size: 13px;
        text-align: center;
      }

      thead th:first-child,
      tbody th {
        text-align: left;
        padding-left: 22px;
      }

      tbody tr:nth-child(even) {
        background: #fafbfd;
      }

      tbody tr:hover {
        background: #f0f5fc;
      }

      .person-name {
        display: block;
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .person-meta {
        display: block;
        margin-top: 3px;
        font-weight: normal;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .legacy {
        display: block;
        margin-top: 5px;
        color: #946000;
        font-size: 12px;
        font-weight: normal;
      }

      td.option-cell {
        padding: 0;
        border-left: 1px solid var(--border);
      }

      .option-label {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 72px;
        height: 100%;
        padding: 12px 4px;
        cursor: pointer;
      }

      .option-label input {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: var(--primary);
      }

      .option-label:has(input:checked) {
        background: #dfeaff;
      }

      .option-label:focus-within {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
      }

      .mobile-label {
        display: none;
      }

      .empty {
        padding: 35px 15px;
        text-align: center;
        color: var(--muted);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 700px) {
        .app {
          padding: 18px 10px;
        }

        .toolbar {
          grid-template-columns: 1fr 1fr;
          padding: 15px;
          gap: 12px;
        }

        .session-field {
          grid-column: 1 / -1;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        button.primary {
          margin-left: 0;
        }

        .summary {
          padding: 15px;
        }

        .table-wrap {
          overflow: visible;
          padding: 12px;
        }

        table,
        tbody {
          display: block;
        }

        colgroup,
        thead {
          display: none;
        }

        tbody tr {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          margin-bottom: 12px;
          border: 1px solid var(--border);
          border-radius: 10px;
          overflow: hidden;
        }

        tbody th {
          display: block;
          grid-column: 1 / -1;
          padding: 12px;
        }

        td.option-cell {
          display: block;
          border-bottom: 0;
        }

        .option-label {
          min-height: 100px;
          flex-direction: column;
          justify-content: space-between;
          gap: 10px;
        }

        .mobile-label {
          display: block;
          font-size: 11px;
          line-height: 1.2;
          text-align: center;
          overflow-wrap: anywhere;
        }
      }
    </style>
  </head>

  <body>
    <main class="app">
      <p class="eyebrow">Inteligencia artificial aplicada a las TIC</p>
      <h1>Control de asistencia</h1>

      <section class="panel" aria-label="Pase de lista">
        <div class="toolbar">
          <div class="field session-field">
            <label for="sessionSelect">Sesión</label>
            <select id="sessionSelect" disabled>
              <option value="">Cargando sesiones...</option>
            </select>
          </div>

          <div class="field">
            <label for="dateInput">Fecha</label>
            <input id="dateInput" type="date" disabled />
          </div>

          <div class="field">
            <label for="timeInput">Hora de inicio</label>
            <input id="timeInput" type="time" disabled />
          </div>

          <div class="actions">
            <button id="scheduleButton" type="button" disabled>
              Guardar horario
            </button>

            <button id="markAllButton" type="button" disabled>
              Todos presentes
            </button>

            <button id="unmarkAllButton" type="button" disabled>
              Todos ausentes
            </button>

            <button id="saveButton" class="primary" type="button" disabled>
              Guardar asistencia
            </button>
          </div>
        </div>

        <div class="summary">
          <div id="counter" class="counts" aria-live="polite"></div>
          <div id="status" class="status" role="status" aria-live="polite">
            Cargando sesiones...
          </div>
        </div>

        <div class="table-wrap" id="tableWrap" aria-busy="false">
          <table
            id="attendanceTable"
            aria-label="Asistencia por participante"
            hidden
          >
            <colgroup>
              <col class="name-col" />
              <col class="state-col" />
              <col class="state-col" />
              <col class="state-col" />
              <col class="state-col" />
            </colgroup>

            <thead>
              <tr>
                <th scope="col">Nombre de la persona</th>
                <th scope="col">Asistió</th>
                <th scope="col">No asistió</th>
                <th scope="col">Justificante</th>
                <th scope="col">Suspensión de clases</th>
              </tr>
            </thead>

            <tbody id="participantsBody"></tbody>
          </table>

          <div id="emptyMessage" class="empty">
            Selecciona una sesión para mostrar los participantes.
          </div>
        </div>
      </section>
    </main>

    <script>
      const OPCIONES = [
        ["PRESENTE", "Asistió"],
        ["AUSENTE", "No asistió"],
        ["JUSTIFICADA", "Justificante"],
        ["SUSPENDIDA", "Suspensión de clases"],
      ];

      const state = {
        sessions: [],
        participants: [],
        selectedSession: "",
        dirty: false,
        scheduleDirty: false,
        loading: false,
        requestId: 0,
      };

      const elements = {};

      document.addEventListener("DOMContentLoaded", init);

      window.addEventListener("beforeunload", (event) => {
        if (state.dirty || state.scheduleDirty) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      function init() {
        [
          "sessionSelect",
          "dateInput",
          "timeInput",
          "scheduleButton",
          "markAllButton",
          "unmarkAllButton",
          "saveButton",
          "counter",
          "status",
          "tableWrap",
          "attendanceTable",
          "participantsBody",
          "emptyMessage",
        ].forEach((id) => {
          elements[id] = document.getElementById(id);
        });

        elements.sessionSelect.addEventListener("change", changeSession);
        elements.scheduleButton.addEventListener("click", saveSchedule);
        elements.markAllButton.addEventListener("click", () =>
          markAll("PRESENTE"),
        );
        elements.unmarkAllButton.addEventListener("click", () =>
          markAll("AUSENTE"),
        );
        elements.saveButton.addEventListener("click", saveAttendance);

        elements.dateInput.addEventListener("input", scheduleChanged);
        elements.timeInput.addEventListener("input", scheduleChanged);

        updateCounter();

        if (
          typeof google === "undefined" ||
          !google.script ||
          !google.script.run
        ) {
          setMessage(
            "Abre esta aplicación desde la URL de Google Apps Script.",
            "error",
          );
          return;
        }

        loadSessions();
      }

      function loadSessions() {
        setLoading(true);
        setMessage("Cargando sesiones...");

        google.script.run
          .withSuccessHandler((sessions) => {
            state.sessions = Array.isArray(sessions) ? sessions : [];
            renderSessions();
            setLoading(false);

            setMessage(
              state.sessions.length
                ? "Selecciona una sesión para registrar asistencia."
                : "No hay sesiones. Ejecuta prepararBaseDatos() en Apps Script.",
            );
          })
          .withFailureHandler(showError)
          .obtenerSesiones();
      }

      function renderSessions() {
        elements.sessionSelect.replaceChildren();

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Selecciona una sesión";
        elements.sessionSelect.appendChild(placeholder);

        state.sessions.forEach((session) => {
          const option = document.createElement("option");
          option.value = session.idSesion;
          option.textContent =
            `${session.idSesion} · ${session.tema} · ` +
            `${session.fecha} ${session.hora || ""}`;

          elements.sessionSelect.appendChild(option);
        });

        elements.sessionSelect.value = state.selectedSession;
      }

      function changeSession() {
        const next = elements.sessionSelect.value;

        if (
          (state.dirty || state.scheduleDirty) &&
          !window.confirm(
            "Hay cambios sin guardar. ¿Deseas descartarlos y cambiar de sesión?",
          )
        ) {
          elements.sessionSelect.value = state.selectedSession;
          return;
        }

        state.selectedSession = next;
        state.participants = [];
        state.dirty = false;
        state.scheduleDirty = false;
        state.requestId += 1;

        const session = state.sessions.find((item) => item.idSesion === next);

        elements.dateInput.value = session ? session.fecha : "";
        elements.timeInput.value = session ? session.hora || "08:00" : "";

        renderParticipants();

        if (!next) {
          setMessage("Selecciona una sesión.");
          return;
        }

        const requestId = state.requestId;
        setLoading(true);
        setMessage("Cargando participantes...");

        google.script.run
          .withSuccessHandler((participants) => {
            if (requestId !== state.requestId || next !== state.selectedSession)
              return;

            state.participants = (
              Array.isArray(participants) ? participants : []
            ).map((participant) => ({
              ...participant,
              estado:
                participant.estado ||
                (participant.presente ? "PRESENTE" : "AUSENTE"),
            }));

            renderParticipants();
            setLoading(false);

            const legacy = state.participants.some(
              (participant) =>
                !OPCIONES.some(([value]) => value === participant.estado),
            );

            setMessage(
              legacy
                ? "Hay estados anteriores señalados bajo el nombre. Se conservarán si no los cambias."
                : `Sesión ${next}: ${session ? session.estado : ""}.`,
            );
          })
          .withFailureHandler((error) => {
            if (requestId === state.requestId) showError(error);
          })
          .obtenerParticipantes(next);
      }

      function renderParticipants() {
        elements.participantsBody.replaceChildren();

        const hasParticipants = state.participants.length > 0;
        elements.attendanceTable.hidden = !hasParticipants;
        elements.emptyMessage.hidden = hasParticipants;

        state.participants.forEach((participant, index) => {
          const row = document.createElement("tr");

          const personCell = document.createElement("th");
          personCell.scope = "row";

          const name = document.createElement("span");
          name.className = "person-name";
          name.textContent = participant.nombre;

          const meta = document.createElement("span");
          meta.className = "person-meta";
          meta.textContent = `${participant.idParticipante} · ${participant.correo}`;

          const legacy = document.createElement("span");
          legacy.className = "legacy";
          updateLegacyLabel(legacy, participant.estado);

          personCell.append(name, meta, legacy);
          row.appendChild(personCell);

          OPCIONES.forEach(([value, title]) => {
            const cell = document.createElement("td");
            cell.className = "option-cell";

            const label = document.createElement("label");
            label.className = "option-label";

            const mobileLabel = document.createElement("span");
            mobileLabel.className = "mobile-label";
            mobileLabel.textContent = title;

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `asistencia-${index}`;
            radio.value = value;
            radio.checked = participant.estado === value;
            radio.setAttribute("aria-label", `${title}: ${participant.nombre}`);

            radio.addEventListener("change", () => {
              if (state.loading) return;

              participant.estado = value;
              state.dirty = true;
              updateLegacyLabel(legacy, value);
              updateCounter();
              updateControls();
              setMessage("Hay cambios de asistencia sin guardar.");
            });

            label.append(mobileLabel, radio);
            cell.appendChild(label);
            row.appendChild(cell);
          });

          elements.participantsBody.appendChild(row);
        });

        updateCounter();
        updateControls();
      }

      function updateLegacyLabel(element, estado) {
        const known = OPCIONES.some(([value]) => value === estado);
        element.hidden = known;
        element.textContent = known
          ? ""
          : `Estado guardado anteriormente: ${estado}`;
      }

      function markAll(estado) {
        if (state.loading || !state.participants.length) return;

        state.participants.forEach((participant) => {
          participant.estado = estado;
        });

        state.dirty = true;
        renderParticipants();
        setMessage("Hay cambios de asistencia sin guardar.");
      }

      function updateCounter() {
        const counts = {
          PRESENTE: 0,
          AUSENTE: 0,
          JUSTIFICADA: 0,
          SUSPENDIDA: 0,
        };

        let otros = 0;

        state.participants.forEach((participant) => {
          if (
            Object.prototype.hasOwnProperty.call(counts, participant.estado)
          ) {
            counts[participant.estado] += 1;
          } else {
            otros += 1;
          }
        });

        const labels = [
          `Asistió: ${counts.PRESENTE}`,
          `No asistió: ${counts.AUSENTE}`,
          `Justificante: ${counts.JUSTIFICADA}`,
          `Suspensión de clases: ${counts.SUSPENDIDA}`,
        ];

        if (otros) labels.push(`Otros estados: ${otros}`);
        labels.push(`Total: ${state.participants.length}`);

        elements.counter.replaceChildren();

        labels.forEach((text) => {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = text;
          elements.counter.appendChild(badge);
        });
      }

      function saveAttendance() {
        if (
          state.loading ||
          !state.selectedSession ||
          !state.participants.length
        )
          return;

        const idSesion = state.selectedSession;
        const payload = state.participants.map((participant) => ({
          idParticipante: participant.idParticipante,
          estado: participant.estado,
        }));

        setLoading(true);
        setMessage("Guardando asistencia...");

        google.script.run
          .withSuccessHandler((result) => {
            state.dirty = false;

            const session = state.sessions.find(
              (item) => item.idSesion === idSesion,
            );

            if (session) session.estado = "REGISTRADA";

            setLoading(false);

            setMessage(
              `Asistencia guardada: ${result.total} registros. ` +
                `Nuevos: ${result.insertados}. ` +
                `Actualizados: ${result.actualizados}.` +
                (state.scheduleDirty ? " El horario sigue sin guardar." : ""),
              "success",
            );
          })
          .withFailureHandler(showError)
          .guardarAsistencia(idSesion, payload);
      }

      function scheduleChanged() {
        const session = state.sessions.find(
          (item) => item.idSesion === state.selectedSession,
        );

        state.scheduleDirty =
          Boolean(session) &&
          (elements.dateInput.value !== session.fecha ||
            elements.timeInput.value !== (session.hora || "08:00"));

        updateControls();

        if (state.scheduleDirty) {
          setMessage("Hay cambios de horario sin guardar.");
        }
      }

      function saveSchedule() {
        if (state.loading || !state.selectedSession) return;

        if (
          !elements.dateInput.reportValidity() ||
          !elements.timeInput.reportValidity() ||
          !elements.dateInput.value ||
          !elements.timeInput.value
        ) {
          setMessage("Selecciona una fecha y una hora válidas.", "error");
          return;
        }

        const idSesion = state.selectedSession;
        const fecha = elements.dateInput.value;
        const hora = elements.timeInput.value;

        setLoading(true);
        setMessage("Guardando horario...");

        google.script.run
          .withSuccessHandler((result) => {
            const session = state.sessions.find(
              (item) => item.idSesion === idSesion,
            );

            if (session) {
              session.fecha = result.fecha;
              session.hora = result.hora;
              session.estado = result.estado;
            }

            state.scheduleDirty = false;
            renderSessions();
            setLoading(false);

            setMessage(
              "Horario guardado correctamente." +
                (state.dirty ? " La asistencia sigue sin guardar." : ""),
              "success",
            );
          })
          .withFailureHandler(showError)
          .programarSesion(idSesion, fecha, hora);
      }

      function updateControls() {
        const busy = state.loading;
        const hasSession = Boolean(state.selectedSession);
        const hasParticipants = state.participants.length > 0;

        elements.sessionSelect.disabled = busy || !state.sessions.length;
        elements.dateInput.disabled = busy || !hasSession;
        elements.timeInput.disabled = busy || !hasSession;

        elements.scheduleButton.disabled =
          busy ||
          !hasSession ||
          !elements.dateInput.value ||
          !elements.timeInput.value;

        elements.markAllButton.disabled = busy || !hasParticipants;
        elements.unmarkAllButton.disabled = busy || !hasParticipants;

        // Permite guardar una sesión con todos ausentes desde el inicio.
        elements.saveButton.disabled = busy || !hasParticipants;

        elements.participantsBody.querySelectorAll("input").forEach((input) => {
          input.disabled = busy;
        });

        elements.tableWrap.setAttribute("aria-busy", String(busy));
      }

      function setLoading(loading) {
        state.loading = loading;
        updateControls();
      }

      function setMessage(message, type = "") {
        elements.status.textContent = message;
        elements.status.className = `status ${type}`;
      }

      function showError(error) {
        setLoading(false);
        setMessage(
          error && error.message
            ? error.message
            : "Ocurrió un error. Intenta nuevamente.",
          "error",
        );
      }
    </script>
  </body>
</html>
